# The statement-coverage gate: the roadmap's v0.8.0 bar, measured over
# production code with a pinned tool, the exclusions checked in
# (scripts/coverage-exclusions.txt). The gate runs on the merged report
# of two measures: the default backend and the Postgres backend, so a
# whole production backend (pg.rs) is not invisible to the number.
#
# No pull_request trigger on purpose: the PR lane does not pay for the
# coverage build, and an edit to this file is not a workflow-lane PR
# that every open PR must merge. The same reason bench.yml and soak.yml
# are their own files.
#
# The work is split across three runners: four runs in a row lost the
# runner mid-measure ("The hosted runner lost communication"), and one
# job that builds and runs the whole workspace twice does not leave the
# runner's agent enough room. Job `measure` builds and runs one
# instrumented backend and uploads its merged profile as an artifact;
# job `gate` rebuilds the instrumented binaries without running tests
# (--no-run) and reports the two downloaded profiles together.

name: coverage
on:
  push:
    branches: [main]
  workflow_dispatch:

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # Everything the measure writes stays under the worktree's own target
  # dir; nothing goes to /tmp (the run that filled the runner's disk
  # wrote there).
  CARGO_LLVM_COV_TARGET_DIR: target/coverage

jobs:
  measure:
    name: coverage, ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: the default backend
            value: ""
            name: sqlite
          - backend: the postgres backend
            value: postgres
            name: postgres
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The instrumented build is one build: both matrix cells and
          # the gate share it, and the first run to finish saves it.
          key: coverage-instrumented
      # cargo-llvm-cov, pinned by version and the release tarball's
      # sha256 (the same discipline the action pins follow), downloaded
      # with curl so no third-party action enters the supply chain.
      # v0.9.1 is the newest release at least two weeks old when this
      # pin was made (2026-09-06).
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          # An empty file holds no patterns, and an empty regex would
          # match everything: the flag is passed only when a pattern
          # exists.
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      # The profile the gate merges carries the measure's conditions in
      # its name, so the download on the gate job lands under the same
      # name cargo-llvm-cov's report step looks for: it merges every
      # *.profraw in the target dir into <workspace>.profdata, and
      # keeps an existing profdata when no profraw is present.
      - name: the profile's name, from the checkout's shape
        run: echo "COVERAGE_PROFILE=$(basename "$GITHUB_WORKSPACE").profdata" >> "$GITHUB_ENV"

      # A vacuous exclusion is the same bug class as the soak's zero
      # counts: a pattern that matches no tracked file excludes nothing
      # and promises a number the report does not hold. The gate reads
      # the file, so this guard runs before the measures.
      - name: every exclusion pattern matches a tracked file
        run: |
          ok=1
          while IFS= read -r pattern; do
            if ! git ls-files | grep -qE "$pattern"; then
              echo "the exclusion pattern '$pattern' matches no tracked file"
              ok=0
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
          [ "$ok" = 1 ]
      # One measure per job, the way cargo-llvm-cov v0.9.1's README
      # documents merging runs under different test conditions: one
      # `clean --workspace` first, then the measure with `--no-report`
      # — which itself disables the clean, and `--no-clean` is not only
      # unneeded but refused beside `--no-report` in this version. The
      # takeover test stays out: it stops the shared database, as in
      # ci.yml's jobs.
      - name: the runner's disk and memory, before the build
        run: df -h / | tail -1; free -m | awk 'NR==2'
      - name: clean the coverage workspace
        run: cargo llvm-cov clean --workspace
      - name: measure
        run: |
          set -o pipefail
          ( while sleep 30; do date -u +%T; df -h / | tail -1; free -m | awk 'NR==2'; du -sh target 2>/dev/null; done ) &
          watcher=$!
          nice -n 19 cargo llvm-cov --no-report --workspace \
            ${COVERAGE_IGNORE:+--ignore-filename-regex "$COVERAGE_IGNORE"} \
            | tee measure.log
          status=$?
          kill "$watcher"
          exit "$status"
        env:
          PROPTEST_CASES: "64"
          SCION_TEST_BACKEND: ${{ matrix.value }}
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
      # The measure's own profraw set, merged into the one profdata the
      # gate job downloads: a profdata is far smaller than its profraw
      # set, and the report here runs without tests, so the summary is
      # the per-backend number for the PR body's table.
      - name: the measure's own report
        run: |
          set -o pipefail
          cargo llvm-cov report --summary-only \
            ${COVERAGE_IGNORE:+--ignore-filename-regex "$COVERAGE_IGNORE"} \
            | tee target/coverage/backend-summary.txt
      - name: upload the measure's profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.name }}
          path: target/coverage/${{ env.COVERAGE_PROFILE }}
          if-no-files-found: error
      - name: keep the profiles out of the cache
        if: always()
        run: rm -rf target/coverage

  gate:
    name: coverage, the gate
    needs: [measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Same instrumented build the measures saved.
          key: coverage-instrumented
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      - name: the profiles of both measures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: target/coverage
          merge-multiple: true
      - name: the runner's disk and memory, before the build
        run: df -h / | tail -1; free -m | awk 'NR==2'
      # The report needs the instrumented binaries, but no test run:
      # --no-run builds them and reports what the profiles hold. The
      # gate reads the merged number, and the proof below reads its
      # printed list.
      - name: the merged report, and the gate
        run: |
          set -o pipefail
          nice -n 19 cargo llvm-cov --no-run --summary-only --fail-under-lines 80 \
            ${COVERAGE_IGNORE:+--ignore-filename-regex "$COVERAGE_IGNORE"} \
            | tee target/coverage/report-summary.txt
          # The proof the filter applies: no excluded file may appear
          # in the printed per-file list.
          while IFS= read -r pattern; do
            if grep -qE "$pattern" target/coverage/report-summary.txt; then
              echo "the report still shows a file matching the exclusion '$pattern'"
              exit 1
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
      - name: keep the profiles out of the cache
        if: always()
        run: rm -rf target/coverage
