name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, please use the private
        report described in SECURITY.md instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of commands that shows the problem.
      render: sh
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output and logs
      description: Error messages, `scn --json` output, or server logs.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built (`git rev-parse --short HEAD`), and your OS.
    validations:
      required: true
